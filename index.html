<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>个人主页 | 陈佳希</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #fdf2f8;
            line-height: 1.8;
            color: #333;
        }

        .header {
            text-align: center;
            background-color: #f25b8f;
            color: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(242, 91, 143, 0.15);
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
        }

        .content {
            background-color: #fff;
            padding: 40px;
            margin-top: 28px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .profile-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 32px;
        }

        .avatar {
            flex-shrink: 0;
        }

        .avatar img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #fce4ec;
            box-shadow: 0 4px 10px rgba(0,0,0,0.07);
        }

        .info {
            flex: 1;
            font-size: 16px;
            line-height: 1.4;
        }

        .info-name {
            font-size: 22px;
            color: #f25b8f;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .visitor {
            flex-shrink: 0;
            padding: 10px 16px;
            background: #fef6f9;
            border-radius: 12px;
            color: #f25b8f;
            font-weight: 500;
            white-space: nowrap;
        }

        .content h2 {
            color: #f25b8f;
            font-size: 22px;
            margin-bottom: 16px;
        }

        .content ul {
            padding-left: 24px;
            margin-bottom: 28px;
        }

        .content li {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .divider {
            height: 1px;
            background-color: #fce4ec;
            margin: 32px 0;
        }

        .comment-box {
            background: #fef6f9;
            padding: 24px;
            border-radius: 16px;
            margin-top: 12px;
        }

        .comment-box textarea {
            width: 100%;
            height: 120px;
            padding: 14px;
            border: 1px solid #fce4ec;
            border-radius: 10px;
            resize: none;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 12px;
            outline-color: #f25b8f;
        }

        .comment-box button {
            background: #f25b8f;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .comment-box button:hover {
            background: #e04a7d;
        }

        .footer {
            text-align: center;
            margin-top: 36px;
            color: #999;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>欢迎来到我的个人网页</h1>
    <p>GitHub Pages · 个人主页</p>
</div>

<div class="content">
    <div class="profile-row">
        <div class="avatar_of_firstweb">
            <img src="images/avatar_of_firstweb.png" alt="陈佳希">
        </div>

        <div class="info">
            <div class="info-name">陈佳希</div>
            <p>学号：2112517058</p>
            <p>专业：工业设计工程</p>
        </div>

        <div class="visitor">
            <span style="color:#f25b8f;">👥</span> 访客人数：
            <img src="https://api.visitorbadge.io/api/visitors?url=your-github-pages-url&countColor=%23f25b8f&labelColor=%ffffff&color=%f25b8f" alt="访客统计">
        </div>
    </div>

    <div class="divider"></div>

    <h2>我的兴趣</h2>
    <ul>
        <li>人工智能</li>
        <li>UI/UX</li>
        <li>三维建模与动态</li>
    </ul>

    <div class="divider"></div>

    <h2>联系方式</h2>
    <p>邮箱：2486754851@qq.com</p>

    <div class="divider"></div>

    <h2>留言板</h2>
    <div class="comment-box">
        <textarea placeholder="请留下你的留言..."></textarea>
        <button>提交留言</button>
    </div>
</div>

<div class="footer">
    <p>&copy; 2026 陈佳希 | Powered by GitHub Pages</p>
</div>

</body>
</html>
